<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MeterSe | Investor Journey</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="frame" id="frame">
    <main class="stage" id="stage" aria-label="MeterSe investor presentation">
      <div class="world" id="world">
        <svg id="map" aria-hidden="true"></svg>
        <div id="slides"></div>
        <div id="actors" aria-hidden="true"></div>
        <div id="tunnels" aria-hidden="true"></div>
      </div>
      <div class="chrome">
        <div class="chrome-bottom">
          <div class="navigation">
            <button type="button" id="previous"><span aria-hidden="true">&#8592;</span></button>
            <button type="button" id="next"><span aria-hidden="true">&#8594;</span></button>
          </div>
          <div class="control-hint" id="control-hint"></div>
        </div>
        <div class="tools">
          <button type="button" id="presenter">P</button>
          <button type="button" id="fullscreen">F</button>
          <button type="button" id="print">&#9113;</button>
        </div>
        <aside class="minimap" aria-hidden="true">
          <div class="minimap-title" id="minimap-title"></div>
          <svg id="minimap" viewBox="0 0 1920 11160" preserveAspectRatio="xMidYMid meet"></svg>
        </aside>
        <div class="status" id="status" role="status" aria-live="polite"></div>
      </div>
      <div class="overview" id="overview">
        <div class="overview-copy">
          <div class="eyebrow" id="overview-kicker"></div>
          <h2 id="overview-title"></h2>
          <p id="overview-text"></p>
        </div>
        <div class="overview-list">
          <div class="eyebrow" id="overview-hint"></div>
          <div id="overview-buttons"></div>
        </div>
      </div>
    </main>
  </div>
  <div class="print-pages" id="print-pages"></div>
  <div class="fatal" id="fatal" role="alert" hidden></div>
  <script src="vendor/gsap.min.js"></script>
  <script src="vendor/DrawSVGPlugin.min.js"></script>
  <script src="vendor/SplitText.min.js"></script>
  <script src="vendor/CustomEase.min.js"></script>
  <script src="vendor/MotionPathPlugin.min.js"></script>
  <script src="config.js"></script>
  <script src="deck.js"></script>
</body>
</html>
